; WiFi Source Locator - sensor node firmware (Seeed XIAO ESP32-C3 / S3 / C6)
;
;   pio run -e c3 -t upload                      wired node, id 0
;   PLATFORMIO_BUILD_FLAGS="-DNODE_ID=2" pio run -e c3 -t upload
;   pio run -e c3_remote -t upload               wireless (ESP-NOW) map-mode node
;
; The node id can also be changed later over USB serial:  id 2

[platformio]
default_envs = c3

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
build_flags =
    -I ../common
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:c3]
board = seeed_xiao_esp32c3

[env:s3]
board = seeed_xiao_esp32s3

[env:c6]
board = seeed_xiao_esp32c6

[env:c3_remote]
board = seeed_xiao_esp32c3
build_flags = ${env.build_flags} -DNODE_REMOTE=1

[env:s3_remote]
board = seeed_xiao_esp32s3
build_flags = ${env.build_flags} -DNODE_REMOTE=1

[env:c6_remote]
board = seeed_xiao_esp32c6
build_flags = ${env.build_flags} -DNODE_REMOTE=1
